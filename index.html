function jerseyGeo(){
  const stripeP=[],stripeUV=[],concreteP=[],concreteUV=[];
  const profile=[[-.42,0],[.42,0],[.42,.14],[.31,.48],[.23,.82],[-.23,.82],[-.31,.48],[-.42,.14]];
  const addTri=(P,U,a,b,c,ua,ub,uc)=>{P.push(...a,...b,...c);U.push(...ua,...ub,...uc)};
  const addQuad=(P,U,a,b,c,d,uv)=>{

    addTri(P,U,a,c,d,uv[0],uv[2],uv[3]);
  };
  for(let i=0;i<profile.length;i++){
    const j=(i+1)%profile.length,[z0,y0]=profile[i],[z1,y1]=profile[j];
    const pts=[[-.5,y0,z0],[.5,y0,z0],[.5,y1,z1],[-.5,y1,z1]];
    const v0=y0/.82,v1=y1/.82,uv=[[0,v0],[1,v0],[1,v1],[0,v1]];

  }
  const centerY=profile.reduce((a,p)=>a+p[1],0)/profile.length;
  const centerZ=profile.reduce((a,p)=>a+p[0],0)/profile.length;
  for(const x of [-.5,.5]){
    for(let i=0;i<profile.length;i++){
      const j=(i+1)%profile.length;

}

function continuousBarrier(segments){
  if(!segments.length)return;

    const a=seg.a||0,c=Math.cos(a),sn=Math.sin(a),len=seg.len;
    for(let i=0;i<srcP.length/3;i++){
      const lx=srcP[i*3]*len,ly=srcP[i*3+1]+seg.y,lz=srcP[i*3+2];
      const wx=seg.x+lx*c-lz*sn,wz=seg.z+lx*sn+lz*c;
      const u=(seg.x+lx*c+110)/2.5,v=srcUV[i*2+1];
      const isStripe=i<stripeLimit,P=isStripe?stripeP:concreteP,U=isStripe?stripeUV:concreteUV;
      P.push(wx,ly,wz);U.push(u,v);
    }
  }
  const stripeCount=stripeP.length/3,concreteCount=concreteP.length/3;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(stripeP.concat(concreteP),3));

}

  if(v){ts.y=clamp(ts.y+v*dt*4,1.2,15);}
  cs.x+=(ts.x-cs.x)*.14;cs.y+=(ts.y-cs.y)*.14;cs.z+=(ts.z-cs.z)*.14;
  cs.yaw+=(ts.yaw-cs.yaw)*.16;cs.pitch+=(ts.pitch-cs.pitch)*.16;cs.fov+=(ts.fov-cs.fov)*.16;
  if(Math.abs(camera.fov-cs.fov)>.001){camera.fov=cs.fov;camera.updateProjectionMatrix()}
  camera.position.set(cs.x,cs.y,cs.z);
  look.set(cs.x-Math.sin(cs.yaw)*Math.cos(cs.pitch)*20,cs.y+Math.sin(cs.pitch)*20,cs.z-Math.cos(cs.yaw)*Math.cos(cs.pitch)*20);
  camera.lookAt(look);renderer.render(scene,camera);
}
function startRender(){if(!rafId)animate()}
function stopRender(){if(rafId){cancelAnimationFrame(rafId);rafId=0}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRender();else{clock.getDelta();startRender()}});
startRender();
</script>
